<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260">
  <defs>
    <!-- Gradients -->
    <radialGradient id="mindy-head-grad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDEAF4"/>
    </radialGradient>
    <linearGradient id="mindy-visor-rim-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B9A6DC"/>
      <stop offset="100%" stop-color="#9C86C8"/>
    </linearGradient>
    <linearGradient id="mindy-visor-bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4F3F9"/>
      <stop offset="100%" stop-color="#E3E1EC"/>
    </linearGradient>
    <linearGradient id="mindy-eye-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7B5EA7"/>
      <stop offset="100%" stop-color="#9A7EC9"/>
    </linearGradient>
    <radialGradient id="mindy-blush-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5B9AE" stop-opacity="0.60"/>
      <stop offset="100%" stop-color="#F5B9AE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mindy-body-grad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDEAF4"/>
    </radialGradient>
    <linearGradient id="mindy-arm-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2DFEE"/>
    </linearGradient>
    <linearGradient id="mindy-leg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2DFEE"/>
    </linearGradient>
  </defs>

  <!-- Shadow under feet -->
  <ellipse cx="100" cy="245" rx="45" ry="8" fill="#7B5EA7" opacity="0.15"/>

  <!-- LEGS -->
  <g id="mindy-legs">
    <!-- Left Leg -->
    <path d="M 70 210 C 60 215, 55 240, 65 245 C 75 250, 95 245, 90 230 C 85 210, 75 210, 70 210 Z" fill="url(#mindy-leg-grad)"/>
    <!-- Right Leg -->
    <path d="M 130 210 C 140 215, 145 240, 135 245 C 125 250, 105 245, 110 230 C 115 210, 125 210, 130 210 Z" fill="url(#mindy-leg-grad)"/>
    <!-- Feet soles/shoes -->
    <path d="M 62 242 C 70 248, 90 245, 92 238 C 93 234, 88 236, 80 238 C 70 240, 60 238, 62 242 Z" fill="#B9A6DC"/>
    <path d="M 138 242 C 130 248, 110 245, 108 238 C 107 234, 112 236, 120 238 C 130 240, 140 238, 138 242 Z" fill="#B9A6DC"/>
  </g>

  <!-- ARMS -->
  <g id="mindy-arm-left">
    <!-- Joint -->
    <circle cx="55" cy="165" r="7" fill="#D3D0DF"/>
    <!-- Arm -->
    <path d="M 50 170 C 35 185, 30 210, 40 220 C 50 220, 55 200, 60 180 Z" fill="url(#mindy-arm-grad)"/>
    <!-- Cuff -->
    <path d="M 36 214 C 42 224, 52 220, 47 210 Z" fill="#B9A6DC"/>
    <!-- Hand -->
    <circle cx="42" cy="220" r="5" fill="#FFFFFF"/>
  </g>

  <g id="mindy-arm-right">
    <!-- Joint -->
    <circle cx="145" cy="165" r="7" fill="#D3D0DF"/>
    <!-- Arm -->
    <path d="M 150 170 C 165 185, 170 210, 160 220 C 150 220, 145 200, 140 180 Z" fill="url(#mindy-arm-grad)"/>
    <!-- Cuff -->
    <path d="M 164 214 C 158 224, 148 220, 153 210 Z" fill="#B9A6DC"/>
    <!-- Hand -->
    <circle cx="158" cy="220" r="5" fill="#FFFFFF"/>
  </g>

  <!-- BODY -->
  <g id="mindy-body">
    <!-- Torso -->
    <path d="M 60 150 C 45 190, 70 225, 100 230 C 130 225, 155 190, 140 150 C 130 140, 70 140, 60 150 Z" fill="url(#mindy-body-grad)"/>
    <!-- Chest Button Ring -->
    <circle cx="100" cy="180" r="16" fill="#B9A6DC"/>
    <circle cx="100" cy="180" r="11" fill="#FFFFFF"/>
    <!-- Accent Dots -->
    <circle cx="70" cy="170" r="3" fill="#B9A6DC"/>
    <circle cx="130" cy="170" r="3" fill="#B9A6DC"/>
  </g>

  <!-- HEAD -->
  <g id="mindy-head">
    <!-- Earpieces (Ears) -->
    <g id="mindy-ears">
      <!-- Left Ear -->
      <rect x="16" y="80" width="20" height="46" rx="10" fill="#B9A6DC"/>
      <rect x="22" y="88" width="8" height="30" rx="4" fill="#EAE7F2"/>
      <!-- Right Ear -->
      <rect x="164" y="80" width="20" height="46" rx="10" fill="#B9A6DC"/>
      <rect x="170" y="88" width="8" height="30" rx="4" fill="#EAE7F2"/>
    </g>

    <!-- Shell/Helmet -->
    <path d="M 100 15 C 165 15, 178 60, 178 105 C 178 148, 145 165, 100 165 C 55 165, 22 148, 22 105 C 22 60, 35 15, 100 15 Z" fill="url(#mindy-head-grad)"/>
    
    <!-- Faint Seam Lines -->
    <path d="M 70 18 C 70 30, 80 40, 100 40 C 120 40, 130 30, 130 18" fill="none" stroke="#DCD9E6" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Visor -->
    <g id="mindy-visor">
      <!-- Outer Rim -->
      <path d="M 100 38 C 145 38, 158 65, 158 108 C 158 138, 138 152, 100 152 C 62 152, 42 138, 42 108 C 42 65, 55 38, 100 38 Z" fill="url(#mindy-visor-rim-grad)"/>
      <!-- Screen/Glass -->
      <path d="M 100 45 C 138 45, 148 70, 148 108 C 148 133, 132 144, 100 144 C 68 144, 52 133, 52 108 C 52 70, 62 45, 100 45 Z" fill="url(#mindy-visor-bg-grad)"/>
      <!-- Glass Glare (Diagonal) -->
      <path d="M 100 45 C 115 45, 130 50, 138 65 L 118 142 C 85 138, 58 123, 52 108 C 52 70, 62 45, 100 45 Z" fill="#FFFFFF" opacity="0.25"/>
    </g>

    <!-- Face details -->
    <g id="mindy-face">
      <!-- Cheeks -->
      <g id="mindy-cheeks">
        <circle cx="68" cy="115" r="14" fill="url(#mindy-blush-grad)"/>
        <circle cx="132" cy="115" r="14" fill="url(#mindy-blush-grad)"/>
      </g>
      
      <!-- Eyes -->
      <g id="mindy-eyes">
        <!-- Left Eye -->
        <g id="mindy-eye-left">
          <ellipse cx="82" cy="98" rx="12" ry="17" fill="url(#mindy-eye-grad)"/>
          <!-- Upper left highlight -->
          <ellipse cx="77" cy="90" rx="4.5" ry="6.5" fill="#FFFFFF"/>
          <!-- Lower right highlight -->
          <circle cx="88" cy="107" r="3" fill="#FFFFFF" opacity="0.8"/>
        </g>
        <!-- Right Eye -->
        <g id="mindy-eye-right">
          <ellipse cx="118" cy="98" rx="12" ry="17" fill="url(#mindy-eye-grad)"/>
          <!-- Upper left highlight -->
          <ellipse cx="113" cy="90" rx="4.5" ry="6.5" fill="#FFFFFF"/>
          <!-- Lower right highlight -->
          <circle cx="124" cy="107" r="3" fill="#FFFFFF" opacity="0.8"/>
        </g>
      </g>

      <!-- Mouth -->
      <g id="mindy-mouth">
        <path d="M 94 122 Q 100 130 106 122" fill="none" stroke="#5A3E85" stroke-width="3.5" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
