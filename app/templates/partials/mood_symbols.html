<svg style="display:none;" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1: Very Low (Sad little blob) -->
    <radialGradient id="grad-1" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0EAF7"/>
    </radialGradient>
    
    <!-- 2: Low (Tired/Meh blob) -->
    <radialGradient id="grad-2" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EAF1F7"/>
    </radialGradient>
    
    <!-- 3: Okay (Neutral/Resting blob) -->
    <radialGradient id="grad-3" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FBF5E8"/>
    </radialGradient>
    
    <!-- 4: Good (Happy/Soft blob) -->
    <radialGradient id="grad-4" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FBEAE5"/>
    </radialGradient>
    
    <!-- 5: Great (Ecstatic blob) -->
    <radialGradient id="grad-5" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8E2EA"/>
    </radialGradient>
    
    <!-- Blush -->
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9EAE" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF9EAE" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Base Shapes (Squishy Blobs) -->
    <!-- Sad/Puddled blob -->
    <path id="shape-1" d="M 50 45 C 75 45, 90 65, 90 75 C 90 88, 75 92, 50 92 C 25 92, 10 88, 10 75 C 10 65, 25 45, 50 45 Z" />
    
    <!-- Tired/Droopy blob -->
    <path id="shape-2" d="M 50 35 C 80 30, 88 50, 88 70 C 88 90, 75 92, 50 92 C 25 92, 12 90, 12 70 C 12 50, 20 30, 50 35 Z" />
    
    <!-- Neutral/Balanced blob -->
    <path id="shape-3" d="M 50 25 C 85 25, 90 40, 90 60 C 90 85, 75 90, 50 90 C 25 90, 10 85, 10 60 C 10 40, 15 25, 50 25 Z" />
    
    <!-- Happy/Bouncy blob -->
    <path id="shape-4" d="M 50 20 C 85 15, 92 35, 92 60 C 92 88, 80 92, 50 92 C 20 92, 8 88, 8 60 C 8 35, 15 15, 50 20 Z" />
    
    <!-- Great/Jumping blob -->
    <path id="shape-5" d="M 50 15 C 88 10, 95 35, 95 65 C 95 90, 75 88, 50 88 C 25 88, 5 90, 5 65 C 5 35, 12 10, 50 15 Z" />
  </defs>

  <!-- Symbol 1: Very Low -->
  <symbol id="mood-1-sym" viewBox="0 0 100 100">
    <g class="mood-svg-inner">
      <use href="#shape-1" fill="url(#grad-1)" />
      <g class="eyes">
        <!-- Sad teary eyes -->
        <path d="M 35 65 Q 40 62 45 66" fill="none" stroke="#7A6F8B" stroke-width="3.5" stroke-linecap="round" />
        <path d="M 55 66 Q 60 62 65 65" fill="none" stroke="#7A6F8B" stroke-width="3.5" stroke-linecap="round" />
        <!-- Tears -->
        <circle cx="35" cy="72" r="2.5" fill="#A5C4DF" />
        <circle cx="65" cy="72" r="2.5" fill="#A5C4DF" />
        <!-- Sad Mouth -->
        <path d="M 46 76 Q 50 72 54 76" fill="none" stroke="#7A6F8B" stroke-width="2.5" stroke-linecap="round" />
      </g>
    </g>
  </symbol>

  <!-- Symbol 2: Low -->
  <symbol id="mood-2-sym" viewBox="0 0 100 100">
    <g class="mood-svg-inner">
      <use href="#shape-2" fill="url(#grad-2)" />
      <g class="eyes">
        <!-- Tired flat eyes -->
        <path d="M 33 58 L 43 58" fill="none" stroke="#6C839E" stroke-width="3.5" stroke-linecap="round" />
        <path d="M 57 58 L 67 58" fill="none" stroke="#6C839E" stroke-width="3.5" stroke-linecap="round" />
        <!-- Tired Mouth -->
        <path d="M 45 70 Q 50 72 55 70" fill="none" stroke="#6C839E" stroke-width="2.5" stroke-linecap="round" />
      </g>
    </g>
  </symbol>

  <!-- Symbol 3: Okay -->
  <symbol id="mood-3-sym" viewBox="0 0 100 100">
    <g class="mood-svg-inner">
      <use href="#shape-3" fill="url(#grad-3)" />
      <g class="eyes">
        <!-- Simple large eyes -->
        <circle cx="36" cy="55" r="4.5" fill="#A19385" />
        <circle cx="64" cy="55" r="4.5" fill="#A19385" />
        <!-- Small highlight -->
        <circle cx="34" cy="53" r="1.5" fill="#FFFFFF" />
        <circle cx="62" cy="53" r="1.5" fill="#FFFFFF" />
        <!-- Flat/slight smile Mouth -->
        <path d="M 45 68 Q 50 70 55 68" fill="none" stroke="#A19385" stroke-width="3" stroke-linecap="round" />
      </g>
    </g>
  </symbol>

  <!-- Symbol 4: Good -->
  <symbol id="mood-4-sym" viewBox="0 0 100 100">
    <g class="mood-svg-inner">
      <use href="#shape-4" fill="url(#grad-4)" />
      <g class="eyes">
        <!-- Blushes -->
        <circle cx="28" cy="62" r="12" fill="url(#blush)" />
        <circle cx="72" cy="62" r="12" fill="url(#blush)" />
        <!-- Happy eyes -->
        <circle cx="35" cy="52" r="5" fill="#8C7069" />
        <circle cx="65" cy="52" r="5" fill="#8C7069" />
        <circle cx="33" cy="50" r="2" fill="#FFFFFF" />
        <circle cx="63" cy="50" r="2" fill="#FFFFFF" />
        <!-- Smile -->
        <path d="M 42 66 Q 50 74 58 66" fill="none" stroke="#8C7069" stroke-width="3.5" stroke-linecap="round" />
      </g>
    </g>
  </symbol>

  <!-- Symbol 5: Great -->
  <symbol id="mood-5-sym" viewBox="0 0 100 100">
    <g class="mood-svg-inner">
      <use href="#shape-5" fill="url(#grad-5)" />
      <!-- Shine lines -->
      <path d="M 22 28 L 26 21 L 33 19 L 26 17 L 22 10 L 18 17 L 11 19 L 18 21 Z" fill="#FFFFFF" opacity="0.8" />
      <path d="M 78 30 L 80 25 L 85 24 L 80 23 L 78 18 L 76 23 L 71 24 L 76 25 Z" fill="#FFFFFF" opacity="0.6" />
      <g class="eyes">
        <!-- Blushes -->
        <circle cx="28" cy="60" r="14" fill="url(#blush)" />
        <circle cx="72" cy="60" r="14" fill="url(#blush)" />
        <!-- Very happy arched eyes -->
        <path d="M 30 52 Q 35 44 40 52" fill="none" stroke="#9A697A" stroke-width="4.5" stroke-linecap="round" />
        <path d="M 60 52 Q 65 44 70 52" fill="none" stroke="#9A697A" stroke-width="4.5" stroke-linecap="round" />
        <!-- Open wide smile -->
        <path d="M 42 66 Q 50 82 58 66 Z" fill="#9A697A" />
        <!-- Tongue/Inner mouth -->
        <path d="M 46 72 Q 50 70 54 72 Q 55 75 50 75 Q 45 75 46 72 Z" fill="#FFA3BB" />
      </g>
    </g>
  </symbol>
</svg>
