<!-- Mindy Companion Partial -->
<div id="mindy-container" class="mindy-container" aria-live="polite">
    
    <!-- Launcher Button -->
    <button type="button" id="mindy-launcher" class="mindy-launcher" aria-label="Open Mindy" aria-expanded="false" aria-controls="mindy-panel" title="Mindy">
        <div class="mindy-launcher-avatar">

<img src="{{ url_for('static', filename='img/mindy-full.svg') }}" alt="Mindy Avatar" style="width: 100%; height: 100%; object-fit: contain;">

</div>
</button>
    
    <!-- Mobile Backdrop -->
    <div id="mindy-backdrop" class="mindy-backdrop"></div>

    <!-- Chat Panel -->
    <div id="mindy-panel" class="mindy-panel" role="dialog" aria-labelledby="mindy-title" aria-describedby="mindy-subtitle" aria-modal="false">
        
        <div class="mindy-header">
            <div class="mindy-header-avatar">

<img src="{{ url_for('static', filename='img/mindy-full.svg') }}" alt="Mindy Avatar" style="width: 100%; height: 100%; object-fit: contain;">

</div>
<div class="mindy-header-text">
                <h2 id="mindy-title">Mindy</h2>
                <p id="mindy-subtitle">Your reflection companion</p>
            </div>
            <button type="button" id="mindy-close" class="mindy-close" aria-label="Close Mindy">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        
        <div id="mindy-messages" class="mindy-messages" role="log" aria-live="polite" aria-relevant="additions">
            <!-- Messages inserted here via JS -->
            <div id="mindy-typing" class="mindy-message-row mindy-bot" style="display: none; padding: 20px;">
                <div class="mindy-avatar-small">
                    <!-- Typing state avatar -->
                </div>
                <div class="mindy-bubble mindy-typing-indicator">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </div>


        <div id="mindy-input-area" class="mindy-input-area">
            <label for="mindy-input" class="mindy-sr-only">Message to Mindy</label>
            <textarea id="mindy-input" class="mindy-textarea" placeholder="Type something..." maxlength="1000" rows="1"></textarea>
            <button type="button" id="mindy-send" class="mindy-send" aria-label="Send" disabled>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>
    
    <!-- History Panel Overlay -->
    <div id="mindy-history-panel" class="mindy-history-panel" style="display:none;">
        <div class="mindy-header">
            <div class="mindy-header-text">
                <h2>Mindy Conversations</h2>
            </div>
            <button type="button" id="mindy-history-close" class="mindy-close">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div id="mindy-history-list" class="mindy-history-list">
            <!-- Populated by JS -->
        </div>
    </div>
</div>
<!-- Template for small avatar used in JS -->
<template id="mindy-avatar-template">
<div class="mindy-avatar-small">

<img src="{{ url_for('static', filename='img/mindy-full.svg') }}" alt="Mindy Avatar" style="width: 100%; height: 100%; object-fit: contain;">

</div>
</template>
