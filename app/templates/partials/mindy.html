<!-- Mindy Companion Partial -->
<div id="mindy-container" class="mindy-container">

    <!-- Launcher Button -->
    <button type="button" id="mindy-launcher" class="mindy-launcher" aria-label="Open Mindy" aria-expanded="false" aria-controls="mindy-panel" title="Chat with Mindy">
        <span class="mindy-launcher-avatar">
            <img src="{{ url_for('static', filename='img/mindy-full.svg') }}" alt="">
        </span>
    </button>

    <!-- Mobile Backdrop -->
    <div id="mindy-backdrop" class="mindy-backdrop"></div>

    <!-- Chat Panel -->
    <section id="mindy-panel" class="mindy-panel" role="dialog" aria-labelledby="mindy-title" aria-describedby="mindy-subtitle" aria-modal="false" hidden>

        <header class="mindy-header">
            <div class="mindy-header-avatar">
                <img src="{{ url_for('static', filename='img/mindy-full.svg') }}" alt="">
            </div>
            <div class="mindy-header-text">
                <h2 id="mindy-title">Mindy</h2>
                <p id="mindy-subtitle">Here to chat, listen, or play</p>
            </div>
            <div class="mindy-header-actions">
                <button type="button" id="mindy-history-btn" class="mindy-icon-btn" aria-label="Past conversations" title="Past conversations">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8" /><path d="M3 3v5h5" /><path d="M12 7v5l3 2" /></svg>
                </button>
                <button type="button" id="mindy-new-btn" class="mindy-icon-btn" aria-label="Start a new conversation" title="New conversation">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9" /><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" /></svg>
                </button>
                <button type="button" id="mindy-close" class="mindy-icon-btn" aria-label="Close Mindy" title="Close">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
                </button>
            </div>
        </header>

        <div class="mindy-body">
            <div id="mindy-messages" class="mindy-messages" role="log" aria-live="polite" aria-relevant="additions" tabindex="0" aria-label="Conversation with Mindy">
                <div id="mindy-typing" class="mindy-message-row mindy-bot mindy-typing-row" hidden>
                    <div class="mindy-avatar-small" aria-hidden="true">
                        <img src="{{ url_for('static', filename='img/mindy-full.svg') }}" alt="">
                    </div>
                    <div class="mindy-bubble mindy-typing-indicator" aria-label="Mindy is typing">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            </div>
            <button type="button" id="mindy-jump" class="mindy-jump" hidden>New message ↓</button>
        </div>

        <div id="mindy-suggestions" class="mindy-suggestions" aria-label="Suggested replies"></div>

        <form id="mindy-input-area" class="mindy-input-area" autocomplete="off">
            <label for="mindy-input" class="mindy-sr-only">Message to Mindy</label>
            <textarea id="mindy-input" class="mindy-textarea" placeholder="Say anything…" maxlength="1000" rows="1" aria-describedby="mindy-input-hint"></textarea>
            <span id="mindy-input-hint" class="mindy-sr-only">Press Enter to send, Shift and Enter for a new line.</span>
            <button type="submit" id="mindy-send" class="mindy-send" aria-label="Send message" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
            </button>
        </form>
        <p id="mindy-counter" class="mindy-counter" aria-live="polite" hidden></p>

        <!-- History Panel Overlay -->
        <div id="mindy-history-panel" class="mindy-history-panel" hidden>
            <header class="mindy-header">
                <button type="button" id="mindy-history-close" class="mindy-icon-btn" aria-label="Back to chat" title="Back">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18 9 12l6-6" /></svg>
                </button>
                <div class="mindy-header-text">
                    <h2>Past conversations</h2>
                    <p>Saved privately to your account</p>
                </div>
            </header>
            <div id="mindy-history-list" class="mindy-history-list"></div>
        </div>
    </section>
</div>
<template id="mindy-avatar-template">
    <div class="mindy-avatar-small" aria-hidden="true">
        <img src="{{ url_for('static', filename='img/mindy-full.svg') }}" alt="">
    </div>
</template>
